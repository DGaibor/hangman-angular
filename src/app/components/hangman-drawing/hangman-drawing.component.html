<div class="relative w-40 h-64 mx-auto flex justify-center items-center">

  <div class="w-20 h-1 bg-yellow-400 absolute top-4 left-1/2 transform -translate-x-1/2"></div>
  <div class="w-1 h-56 bg-yellow-400 absolute left-1/2 transform -translate-x-1/2"></div>
  <div class="w-12 h-1 bg-yellow-400 absolute top-4 left-[35%]"></div>
  <div class="w-1 h-10 bg-yellow-400 absolute top-4 left-[35%]"></div>

  <div *ngIf="fails > 0" class="w-12 h-12 border-4 border-white rounded-full absolute top-10 left-1/2 transform -translate-x-1/2"></div>
  <div *ngIf="fails > 1" class="w-1 h-24 bg-white absolute top-24 left-1/2 transform -translate-x-1/2"></div>
  <div *ngIf="fails > 2" class="w-16 h-1 bg-white absolute top-28 left-[44%] transform rotate-[30deg]"></div>
  <div *ngIf="fails > 3" class="w-16 h-1 bg-white absolute top-28 right-[44%] transform rotate-[-30deg]"></div>
  <div *ngIf="fails > 4" class="w-16 h-1 bg-white absolute top-48 left-[44%] transform rotate-[30deg]"></div>
  <div *ngIf="fails > 5" class="w-16 h-1 bg-white absolute top-48 right-[44%] transform rotate-[-30deg]"></div>
</div>
