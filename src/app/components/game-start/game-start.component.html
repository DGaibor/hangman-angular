<div class="flex flex-col items-center justify-center h-screen bg-gray-900 text-white text-center p-6">
  <h1 class="text-4xl font-bold text-yellow-400 mb-4">Welcome to Hangman!</h1>
  <p class="text-lg text-gray-300 mb-6">
    Guess the hidden word letter by letter. Be careful, you only have a few tries!
  </p>

  <button
    pButton
    (click)="startGame()"
    class="p-button-raised p-button-lg bg-blue-600 hover:bg-blue-500 text-white font-semibold shadow-lg"
  >
    <i class="pi pi-play mr-2"></i> Start Game
  </button>
  <div class="mt-8 text-gray-400 text-sm">
    <p>Type letters on your keyboard to guess the word.</p>
    <p>Too many wrong guesses and you lose!</p>
  </div>
</div>
