<div class="flex flex-col items-center justify-center h-screen bg-gray-900 text-white text-center p-6">
  <h1 class="text-4xl font-bold mb-4">
    {{ player?.result ? '🎉 Congratulations! 🎉' : '❌ Game Over ❌' }}
  </h1>

  <p class="text-lg text-gray-300 mb-6">
    {{ player?.result ? 'You guessed the word correctly!' : 'Better luck next time!' }}
  </p>


  <p *ngIf="!player?.result" class="text-lg text-gray-400">
    The correct word was: <span class="font-semibold text-blue-500">{{ player?.word }}</span>
  </p>

  <button
    class="p-button-raised p-button-lg bg-blue-600 hover:bg-blue-500 text-white font-semibold shadow-lg px-6 py-3 rounded-md mt-4"
    (click)="restartGame()">
    <i class="pi pi-replay mr-2"></i> Play Again
  </button>
</div>
